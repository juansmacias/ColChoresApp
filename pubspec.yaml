name: family_chores_app
description: Family Chores App - coordinate household chores, build responsibility, make invisible work visible.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.0

  # Local Database (Drift - Isar fallback for Dart 3.x compatibility)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.6.0+eol

  # Firebase
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  cloud_functions: ^6.0.4
  firebase_messaging: ^16.1.2
  firebase_crashlytics: ^5.0.8
  firebase_analytics: ^12.1.3

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^2.4.0

  # Routing
  go_router: ^17.1.0

  # Networking & Connectivity
  connectivity_plus: ^7.0.0

  # Data Classes & Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Authentication
  google_sign_in: ^6.3.0
  local_auth: ^3.0.1
  sign_in_with_apple: ^7.0.1

  # UI & Design
  google_fonts: ^8.0.2
  lottie: ^3.1.0
  fl_chart: ^1.1.1

  # Media
  image_picker: ^1.1.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.20.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0
  rxdart: ^0.28.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.0
  injectable_generator: ^2.4.0
  drift_dev: ^2.18.0
  freezed: ^3.2.5
  json_serializable: ^6.8.0

  # Testing
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  fake_async: ^1.3.0

  # Linting
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
    - assets/icons/
